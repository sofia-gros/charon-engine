[package]
name = "charon-app"
description = "Charon Engine の共通ウィンドウと固定 tick メインループ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["charon-core/parallel"]

[lints]
workspace = true

[dependencies]
charon-audio = { version = "0.1.0", path = "../charon-audio" }
charon-core = { version = "0.1.0", path = "../charon-core", default-features = false }
charon-game = { version = "0.1.0", path = "../charon-game", default-features = false }
charon-physics = { version = "0.1.0", path = "../charon-physics", default-features = false }
charon-render = { version = "0.1.0", path = "../charon-render", default-features = false }
charon-world = { version = "0.1.0", path = "../charon-world", default-features = false }
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
lewton = "0.10.2"
png = "0.18.1"
pollster = "1.0.1"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
web-time = "1.1.0"
wgpu = "30.0.1"
winit = "0.30.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.2"
egui-winit = "0.37.0"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
gilrs = "0.11.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = "0.23.1"
egui-winit = { version = "0.37.0", default-features = false }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Document", "Element", "HtmlCanvasElement", "HtmlElement", "Node", "Storage", "Window", "console"] }
