[package]
name = "charon-core"
description = "Charon Engine のシミュレーション核 (描画・ウィンドウに依存しない)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rayon = { version = "1.12.0", optional = true }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "sim"
harness = false

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
