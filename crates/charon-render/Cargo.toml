[package]
name = "charon-render"
description = "Charon Engine の wgpu 描画と GPU サーフェス管理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
charon-core = { version = "0.1.0", path = "../charon-core", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", features = ["webgl"] }

[features]
default = ["charon-core/parallel"]

[lints]
workspace = true

[dev-dependencies]
pollster = "1.0.1"
winit = "0.30.13"
