[package]
name = "charon-sandbox"
description = "Charon Engine の動作確認用サンドボックス"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["charon-core/parallel"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "charon-sandbox"
path = "src/main.rs"

[[bin]]
name = "charon-demo"
path = "src/demo_main.rs"

[package.metadata.android]
package = "dev.charon.sandbox"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26

[package.metadata.android.application]
label = "Charon Demo"

# リリースビルド (`cargo apk build --release`) の署名。配布用の本番の鍵ではなく、デバッグ用の鍵で署名する
# (`apps/sandbox/debug.keystore`。コミットしない。GitHub Actions と docs/BUILD_ANDROID.md の手順で作る)。
[package.metadata.android.signing.release]
path = "debug.keystore"
keystore_password = "android"

[dependencies]
charon-app = { version = "0.1.0", path = "../../crates/charon-app", default-features = false }
charon-core = { version = "0.1.0", path = "../../crates/charon-core", default-features = false }
charon-physics = { version = "0.1.0", path = "../../crates/charon-physics", default-features = false }
charon-world = { version = "0.1.0", path = "../../crates/charon-world", default-features = false }
winit = { version = "0.30.13", features = ["android-native-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.130"
