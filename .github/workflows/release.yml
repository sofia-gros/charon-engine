name: Release

# `v*` のタグを push すると、参照デモ (charon-demo) の Windows 版 (zip) と Android 版 (apk) をビルドし、
# GitHub Releases に載せる。例: git tag v0.0.1 && git push origin v0.0.1

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: タグ・アプリ・Android の版を照合
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p charon-sandbox --bin charon-demo
      - name: 配布物を作る (exe と assets を同じ場所に置く)
        shell: pwsh
        run: |
          $name = "charon-demo-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/charon-demo.exe $name/
          Copy-Item -Recurse assets "$name/assets"
          Copy-Item LICENSE, README.md $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: charon-demo-*.zip
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      # ubuntu-latest には Android SDK が入っている。`android-actions/setup-android` は SDK の更新で失敗したので使わない。
      - name: Android SDK と NDK を入れる
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: cargo install --git https://github.com/rust-mobile/cargo-apk cargo-apk --locked
      # リリースビルドの署名に使うデバッグ用の鍵 (本番の配布用の鍵ではない)。
      - name: デバッグ用の鍵を作る
        run: |
          keytool -genkeypair -v -keystore apps/sandbox/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      # `--lib`: APK にするのは cdylib (android_main)。デスクトップの bin は含めない。
      - run: cargo apk build --release -p charon-sandbox --lib
      - name: apk の名前をそろえる
        run: |
          # `target/release/apk` には、署名・整列済みの `charon-sandbox.apk` と、途中の `*-unaligned.apk` (未署名) がある。
          # 署名済みのほうだけを使う。
          ls -l target/release/apk/
          cp target/release/apk/charon-sandbox.apk "charon-demo-${{ github.ref_name }}-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "charon-demo-${{ github.ref_name }}-android-arm64.apk"
          python3 scripts/check-release-version.py "$GITHUB_REF_NAME" "charon-demo-${{ github.ref_name }}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: charon-demo-*.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # v0.0.8 のタグは CI 失敗で Release がないため、直前の公開版を基点にする。
          previous_tag: ${{ github.ref_name == 'v0.0.9' && 'v0.0.7' || '' }}
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          body: |
            ⚠️ 開発中のプレリリースです。製品版としての配布可否は判定していません。Windows/Android の新しい画面・音・保存の実機確認と、素材・第三者ライセンスの最終確認は未完了で、第三者通知文も同梱していません。詳細は[配布前の記録](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASE_CHECK.md)を参照してください。

            Android APK は毎回新しいデバッグ鍵で署名されるため、以前の APK に上書きインストールできません。保存データを退避せずにアンインストールすると失われる可能性があります。正式な更新用署名ではありません。
