name: E05 物質輸送と圧力

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  material-transport:
    name: 物質輸送と圧力を検証 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_BUILD_JOBS: 2
    steps:
      - name: ソースを取得
        uses: actions/checkout@v6
      - name: Linuxのwindow依存を用意
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev
      - name: 固定toolchainを用意
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: 輸送・速度・圧力・変換記録の公開APIを検証
        run: cargo test --locked --test material_transport --test material_motion --test material_receipts --test pressure_job --test material_mixtures --test material_particles
      - name: 速度と端数の保存作例を実行
        run: cargo run --locked --example material_motion
      - name: 物質変換とreceiptの保存作例を実行
        run: cargo run --locked --example material_receipts
      - name: 気体の広域圧力と途中保存の作例を実行
        run: cargo run --locked --example pressure_job
      - name: 混合と分離の保存作例を実行
        run: cargo run --locked --example material_mixtures
      - name: 物質粒子の所有権移動と保存再開の作例を実行
        run: cargo run --locked --example material_particles
