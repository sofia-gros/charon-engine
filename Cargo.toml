[package]
name = "charon-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
noise = "0.9.0"
pixels = "0.17.2"
winit = "0.30.13"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "1.1.8"
png = "0.18"
serde_json = { version = "1", features = ["float_roundtrip", "arbitrary_precision"] }
bincode = "1.3.3"
sha2 = "0.10"
hound = "3.5"
lewton = "0.10"
ttf-parser = "0.25"
unicode-normalization = "0.1"
blake3 = "1"
rapier2d-f64 = { version = "=0.36.1", features = ["serde-serialize", "enhanced-determinism"] }
